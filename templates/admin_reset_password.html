<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="csrf-token" content="{{ csrf_token() }}">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#183d33">
    <title>Reset Admin Password | Sakshi Digital Studio</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Raleway:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        :root { font-family: "Raleway", "Segoe UI", sans-serif; color: #19352d; background: #f2f5f1; }
        * { box-sizing: border-box; }
        body { min-height: 100vh; min-height: 100svh; display: grid; place-items: center; margin: 0; padding: 24px; background: radial-gradient(ellipse at 50% 0%, #d9eee3 0, #f2f5f1 58%, #e8f0ed 100%); }
        .panel { width: min(100%, 480px); padding: 38px; border: 1px solid #dce4dd; border-radius: 10px; background: #fff; box-shadow: 0 18px 55px rgba(24,66,48,.11); }
        .eyebrow { margin: 0 0 9px; color: #1c6b4b; font-size: 12px; font-weight: 800; }
        h1 { margin: 0; color: #183d33; font-size: 29px; font-weight: 800; }
        .copy { margin: 12px 0 22px; color: #64746b; font-size: 15px; line-height: 1.6; }
        .admin-id { margin: 0 0 22px; padding: 14px; border: 1px solid #dce4dd; border-radius: 6px; background: #f7f9f7; }
        .admin-id span { display: block; color: #708078; font-size: 12px; font-weight: 700; }
        .admin-id strong { display: block; margin-top: 5px; color: #19352d; font-size: 15px; overflow-wrap: anywhere; }
        label { display: block; margin: 17px 0 8px; color: #344c42; font-size: 14px; font-weight: 700; }
        input { width: 100%; min-height: 50px; padding: 0 13px; border: 1px solid #dce4dd; border-radius: 6px; font: inherit; font-size: 15px; }
        input:focus { border-color: #1c6b4b; outline: 3px solid rgba(28,107,75,.13); }
        .hint { margin: 7px 0 0; color: #708078; font-size: 12px; }
        button { width: 100%; min-height: 52px; margin-top: 24px; border: 0; border-radius: 6px; color: #fff; background: #1c6b4b; font: inherit; font-size: 15px; font-weight: 800; cursor: pointer; }
        button:hover { background: #15583d; }
        .error { margin: 16px 0 0; padding: 12px 14px; color: #8d342b; background: #fff0ed; font-size: 13px; }
        @media (max-width: 520px) { .panel { padding: 28px 22px; } h1 { font-size: 26px; } }
    </style>
</head>
<body>
    <main class="panel">
        <p class="eyebrow">OTP VERIFIED</p>
        <h1>Naya password set karein</h1>
        <p class="copy">Purana password retrieve nahi hota. Recovery ke baad naya password set karein.</p>
        <p class="admin-id"><span>Verified admin ID</span><strong>{{ admin_email }}</strong></p>
        <form method="post" action="{{ url_for('admin_reset_password') }}">
            <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
            <label for="password">New password</label>
            <input id="password" name="password" type="password" autocomplete="new-password" minlength="10" required>
            <p class="hint">कम से कम 10 characters</p>
            <label for="confirm-password">Confirm new password</label>
            <input id="confirm-password" name="confirm_password" type="password" autocomplete="new-password" minlength="10" required>
            <button type="submit">Save new password</button>
        </form>
        {% if error %}<p class="error" role="alert">{{ error }}</p>{% endif %}
    </main>
</body>
</html>
